// ─────────────────── VISUAL LESSON BUILDER ────────────────────────────
let lbBlocks = [];
let lbSelectedId = null;
let lbDragId = null;
let lbDragOverId = null;

function icoBlock(ch){ return `<span style="width:20px;height:20px;background:var(--surface2);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--mono);">${ch}</span>`; }

function genBlockId(){ return 'blk_'+Math.random().toString(36).slice(2,9); }

function blockDefaults(type){
  const map={
    heading:  {type:'heading',  text:'New Heading',         level:'h2'},
    text:     {type:'text',     text:'Write your paragraph here. Double-click to edit.'},
    image:    {type:'image',    src:'',                     alt:'',  caption:'',  width:'100%'},
    code:     {type:'code',     text:'// paste your code here',lang:'javascript'},
    callout:  {type:'callout',  text:'Key takeaway or important note.', variant:'info'},
    list:     {type:'list',     items:['Item one','Item two','Item three']},
    divider:  {type:'divider'},
    video:    {type:'video',    url:'', caption:''},
    quiz:     {type:'quiz',     question:'Question text', options:['Option A','Option B','Option C','Option D'], correct:0, explanation:''},
  };
  return {...(map[type]||{type}), id:genBlockId()};
}

window.addBlock = (type)=>{
  const block = blockDefaults(type);
  lbBlocks.push(block);
  renderCanvas();
  selectBlock(block.id);
  setTimeout(()=>document.getElementById(`b-${block.id}`)?.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
};

function renderCanvas(){
  const canvas = document.getElementById('lb-canvas');
  const hint = document.getElementById('lb-empty-hint');
  const counter = document.getElementById('lb-block-count');
  if(!canvas) return;
  if(counter) counter.textContent = lbBlocks.length+' block'+(lbBlocks.length!==1?'s':'');
  if(!lbBlocks.length){
    if(hint) hint.style.display='flex';
    const existing = canvas.querySelectorAll('.lb-block');
    existing.forEach(el=>el.remove());
    return;
  }
  if(hint) hint.style.display='none';

  // Remove blocks no longer in list
  canvas.querySelectorAll('.lb-block').forEach(el=>{
    if(!lbBlocks.find(b=>b.id===el.dataset.bid)) el.remove();
  });

  // Render each block in order
  lbBlocks.forEach((block, idx)=>{
    let el = document.getElementById(`b-${block.id}`);
    const isNew = !el;
    if(isNew){
      el = document.createElement('div');
      el.className='lb-block';
      el.id=`b-${block.id}`;
      el.dataset.bid=block.id;
      el.draggable=true;
      el.addEventListener('dragstart', e=>{ lbDragId=block.id; e.dataTransfer.effectAllowed='move'; el.style.opacity='.4'; });
      el.addEventListener('dragend', e=>{ el.style.opacity='1'; lbDragId=null; renderCanvas(); });
      el.addEventListener('dragover', e=>{ e.preventDefault(); lbDragOverId=block.id; highlightDragOver(); });
      el.addEventListener('dragleave', ()=>{ if(lbDragOverId===block.id) lbDragOverId=null; clearDragOver(); });
      el.addEventListener('drop', e=>{ e.preventDefault(); dropBlock(block.id); });
    }

    el.style.cssText = `position:relative;margin-bottom:8px;border:2px solid ${lbSelectedId===block.id?'var(--white)':'transparent'};border-radius:6px;cursor:pointer;transition:border-color .1s;`;
    el.onclick = (e)=>{ e.stopPropagation(); selectBlock(block.id); };

    el.innerHTML = renderBlockContent(block)+`
      <div class="lb-block-toolbar" style="position:absolute;top:6px;right:6px;display:${lbSelectedId===block.id?'flex':'none'};gap:4px;z-index:10;">
        <button onclick="event.stopPropagation();moveBlock('${block.id}',-1)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:2px 6px;border-radius:2px;font-size:11px;cursor:pointer;" title="Move up">↑</button>
        <button onclick="event.stopPropagation();moveBlock('${block.id}',1)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:2px 6px;border-radius:2px;font-size:11px;cursor:pointer;" title="Move down">↓</button>
        <button onclick="event.stopPropagation();duplicateBlock('${block.id}')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:2px 6px;border-radius:2px;font-size:11px;cursor:pointer;" title="Duplicate">⧉</button>
        <button onclick="event.stopPropagation();deleteBlock('${block.id}')" style="background:rgba(255,68,68,.15);border:1px solid var(--danger);color:var(--danger);padding:2px 6px;border-radius:2px;font-size:11px;cursor:pointer;" title="Delete">✕</button>
      </div>
      <div style="position:absolute;left:6px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;cursor:grab;display:${lbSelectedId===block.id?'block':'none'};" title="Drag to reorder">⋮⋮</div>`;

    if(isNew) canvas.appendChild(el);
    else if(canvas.children[idx]!==el) canvas.insertBefore(el, canvas.children[idx]||null);
  });
}

function renderBlockContent(b){
  const pad='padding:12px 40px 12px 32px;';
  switch(b.type){
    case 'heading': return `<div style="${pad}"><${b.level||'h2'} style="font-weight:700;color:var(--white);letter-spacing:-.02em;${b.level==='h2'?'font-size:22px;':b.level==='h3'?'font-size:17px;':'font-size:14px;'}">${esc(b.text)}</${b.level||'h2'}></div>`;
    case 'text': return `<div style="${pad}font-size:15px;color:var(--text2);line-height:1.7;">${esc(b.text).replace(/\n/g,'<br>')}</div>`;
    case 'image':
      if(!b.src) return `<div style="${pad}background:var(--surface2);border:2px dashed var(--border);border-radius:4px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;" onclick="event.stopPropagation();triggerImageUpload('${b.id}')">
        <div style="font-size:28px;opacity:.4;"></div>
        <div style="font-size:13px;color:var(--text3);">Click or drag an image here</div>
        <input type="file" id="img-inp-${b.id}" style="display:none;" accept="image/*" onchange="handleImageFile(event,'${b.id}')">
      </div>`;
      return `<div style="padding:8px 40px 8px 32px;"><img src="${b.src}" alt="${esc(b.alt)}" style="width:${b.width||'100%'};max-width:100%;border-radius:4px;display:block;">${b.caption?`<div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px;text-align:center;">${esc(b.caption)}</div>`:''}</div>`;
    case 'code': return `<div style="${pad}"><pre style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:14px;margin:0;overflow-x:auto;"><code style="font-family:var(--mono);font-size:13px;color:var(--white);">${esc(b.text)}</code></pre>${b.lang?`<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;">${b.lang}</div>`:''}</div>`;
    case 'callout': {
      const colors={info:'rgba(255,255,255,.08)',warn:'rgba(255,204,68,.1)',danger:'rgba(255,68,68,.1)',success:'rgba(68,255,136,.1)'};
      const borders={info:'var(--white)',warn:'var(--warn)',danger:'var(--danger)',success:'var(--success)'};
      return `<div style="${pad}background:${colors[b.variant||'info']};border-left:3px solid ${borders[b.variant||'info']};border-radius:0 4px 4px 0;">
        <div style="font-size:14px;color:var(--white);line-height:1.6;">${esc(b.text).replace(/\n/g,'<br>')}</div>
      </div>`;}
    case 'list': return `<div style="${pad}"><ul style="padding-left:20px;display:flex;flex-direction:column;gap:6px;">${(b.items||[]).map(item=>`<li style="font-size:14px;color:var(--text2);line-height:1.6;">${esc(item)}</li>`).join('')}</ul></div>`;
    case 'divider': return `<div style="padding:8px 32px;"><hr style="border:none;border-top:1px solid var(--border);"></div>`;
    case 'video': {
      const yt = b.url?.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
      const vm = b.url?.match(/vimeo\.com\/(\d+)/);
      if(yt) return `<div style="${pad}"><div style="position:relative;padding-bottom:56.25%;background:var(--surface2);border-radius:4px;overflow:hidden;"><iframe src="https://www.youtube.com/embed/${yt[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div>${b.caption?`<div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px;text-align:center;">${esc(b.caption)}</div>`:''}</div>`;
      if(vm) return `<div style="${pad}"><div style="position:relative;padding-bottom:56.25%;background:var(--surface2);border-radius:4px;overflow:hidden;"><iframe src="https://player.vimeo.com/video/${vm[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div>${b.caption?`<div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px;text-align:center;">${esc(b.caption)}</div>`:''}</div>`;
      return `<div style="${pad}background:var(--surface2);border-radius:4px;padding:16px;text-align:center;"><div style="font-size:13px;color:var(--text3);">${b.url?'⚠ Unsupported video URL. Use YouTube or Vimeo.':'▶ No video URL set. Add one in properties.'}</div></div>`;
    }
    case 'quiz': return `<div style="${pad}background:var(--surface2);border-radius:4px;padding:16px;">
      <div style="font-size:14px;font-weight:600;color:var(--white);margin-bottom:12px;">${esc(b.question)}</div>
      ${(b.options||[]).map((opt,i)=>`<div style="padding:8px 12px;background:${i===b.correct?'rgba(68,255,136,.1)':'var(--surface)'};border:1px solid ${i===b.correct?'var(--success)':'var(--border)'};border-radius:3px;margin-bottom:6px;font-size:13px;color:${i===b.correct?'var(--success)':'var(--text2)'};">${i===b.correct?'✓ ':''}${esc(opt)}</div>`).join('')}
      ${b.explanation?`<div style="margin-top:8px;font-size:12px;color:var(--text3);font-style:italic;">${esc(b.explanation)}</div>`:''}
    </div>`;
    default: return `<div style="${pad}color:var(--text3);font-size:13px;">[${b.type} block]</div>`;
  }
}

function esc(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function selectBlock(id){
  lbSelectedId = id;
  renderCanvas();
  renderProps(id);
}

function renderProps(id){
  const propsEl = document.getElementById('lb-props-body');
  if(!propsEl) return;
  const block = lbBlocks.find(b=>b.id===id);
  if(!block){ propsEl.innerHTML='<div style="color:var(--text3);font-size:13px;">Select a block to edit properties.</div>'; return; }

  const pg = (label,inner)=>`<div class="form-group">${label?`<label class="form-label" style="font-size:9px;">${label}</label>`:''}${inner}</div>`;
  const inp = (field,placeholder='',type='text',value)=>`<input class="form-input" style="font-size:12px;" type="${type}" value="${esc(value!==undefined?value:block[field]||'')}" placeholder="${placeholder}" oninput="updateBlock('${id}','${field}',this.value)" onchange="updateBlock('${id}','${field}',this.value)">`;
  const ta = (field,placeholder='',val)=>`<textarea class="form-textarea" style="font-size:12px;min-height:80px;" placeholder="${placeholder}" oninput="updateBlock('${id}','${field}',this.value)">${val!==undefined?esc(val):esc(block[field]||'')}</textarea>`;
  const sel = (field,opts,cur)=>`<select class="form-select" style="font-size:12px;" onchange="updateBlock('${id}','${field}',this.value)">${opts.map(o=>`<option value="${o.v}" ${(cur||block[field])===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`;

  let html='';
  switch(block.type){
    case 'heading':
      html=pg('Text',ta('text','Heading text',block.text))+
           pg('Level',sel('level',[{v:'h1',l:'H1 — Large'},{v:'h2',l:'H2 — Medium'},{v:'h3',l:'H3 — Small'}]));
      break;
    case 'text':
      html=pg('Text',ta('text','Paragraph text...',block.text));
      break;
    case 'image':
      html=`<div style="margin-bottom:12px;">
        <div style="background:var(--surface2);border:2px dashed var(--border);border-radius:4px;padding:16px;text-align:center;cursor:pointer;" onclick="triggerImageUpload('${id}')">
          ${block.src?`<img src="${block.src}" style="max-width:100%;max-height:80px;object-fit:contain;margin-bottom:8px;border-radius:2px;display:block;margin:0 auto 8px;">`:''} 
          <div style="font-size:12px;color:var(--text3);">${block.src?'Click to change image':'Click or drop image here'}</div>
          <input type="file" id="img-inp-props-${id}" style="display:none;" accept="image/*" onchange="handleImageFile(event,'${id}')">
        </div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:6px;text-align:center;">PNG, JPG, GIF, WebP · Stored as base64</div>
      </div>`+
      pg('Alt text',inp('alt','Describe the image'))+
      pg('Caption',inp('caption','Optional caption'))+
      pg('Width',inp('width','100%','text',block.width||'100%'));
      break;
    case 'code':
      html=pg('Code',ta('text','// code here',block.text))+
           pg('Language',sel('lang',[{v:'javascript',l:'JavaScript'},{v:'python',l:'Python'},{v:'c',l:'C'},{v:'cpp',l:'C++'},{v:'java',l:'Java'},{v:'text',l:'Plain text'}]));
      break;
    case 'callout':
      html=pg('Text',ta('text','Note text...',block.text))+
           pg('Style',sel('variant',[{v:'info',l:'Info (white)'},{v:'warn',l:'Warning (yellow)'},{v:'danger',l:'Danger (red)'},{v:'success',l:'Success (green)'}]));
      break;
    case 'list':
      html=`<div class="form-group"><label class="form-label" style="font-size:9px;">Items (one per line)</label><textarea class="form-textarea" style="font-size:12px;min-height:100px;" oninput="updateBlockList('${id}',this.value)">${(block.items||[]).join('\n')}</textarea></div>`;
      break;
    case 'video':
      html=pg('YouTube or Vimeo URL',inp('url','https://youtube.com/watch?v=...'))+
           pg('Caption',inp('caption','Optional caption'));
      break;
    case 'quiz':
      html=pg('Question',ta('question','Question text...',block.question))+
           `<div class="form-group"><label class="form-label" style="font-size:9px;">Options (one per line)</label><textarea class="form-textarea" style="font-size:12px;min-height:80px;" oninput="updateQuizOptions('${id}',this.value)">${(block.options||[]).join('\n')}</textarea></div>`+
           `<div class="form-group"><label class="form-label" style="font-size:9px;">Correct answer (0-indexed)</label><input class="form-input" style="font-size:12px;" type="number" min="0" value="${block.correct||0}" oninput="updateBlock('${id}','correct',parseInt(this.value)||0)"></div>`+
           pg('Explanation',ta('explanation','Optional explanation...',block.explanation));
      break;
    case 'divider':
      html='<div style="font-size:12px;color:var(--text3);">A horizontal divider. No properties.</div>';
      break;
  }

  html+=`<div style="height:1px;background:var(--border);margin:12px 0;"></div>
    <button class="btn btn-danger btn-sm" style="width:100%;" onclick="deleteBlock('${id}')">Delete Block</button>`;
  propsEl.innerHTML=html;
}

window.updateBlock = (id, field, value)=>{
  const block = lbBlocks.find(b=>b.id===id);
  if(!block) return;
  block[field] = value;
  const el = document.getElementById(`b-${id}`);
  if(el) el.innerHTML = renderBlockContent(block)+el.innerHTML.match(/(<div class="lb-block-toolbar"[\s\S]*?<\/div>\s*<div[\s\S]*?<\/div>)/)?.[1]||'';
  renderCanvas();
};

window.updateBlockList = (id, value)=>{
  const block = lbBlocks.find(b=>b.id===id);
  if(!block) return;
  block.items = value.split('\n').filter(l=>l.trim());
  renderCanvas();
};

window.updateQuizOptions = (id, value)=>{
  const block = lbBlocks.find(b=>b.id===id);
  if(!block) return;
  block.options = value.split('\n').filter(l=>l.trim());
  renderCanvas();
};

window.deleteBlock = (id)=>{
  lbBlocks = lbBlocks.filter(b=>b.id!==id);
  if(lbSelectedId===id){ lbSelectedId=null; const p=document.getElementById('lb-props-body'); if(p) p.innerHTML='<div style="color:var(--text3);font-size:13px;">Select a block to edit properties.</div>'; }
  renderCanvas();
};

window.moveBlock = (id, dir)=>{
  const idx = lbBlocks.findIndex(b=>b.id===id);
  const newIdx = idx+dir;
  if(newIdx<0||newIdx>=lbBlocks.length) return;
  const tmp=lbBlocks[idx]; lbBlocks[idx]=lbBlocks[newIdx]; lbBlocks[newIdx]=tmp;
  renderCanvas();
};

window.duplicateBlock = (id)=>{
  const idx = lbBlocks.findIndex(b=>b.id===id);
  const copy = {...lbBlocks[idx], id:genBlockId()};
  lbBlocks.splice(idx+1,0,copy);
  renderCanvas();
  selectBlock(copy.id);
};

window.clearCanvas = ()=>{
  if(lbBlocks.length && !confirm('Clear all blocks?')) return;
  lbBlocks=[]; lbSelectedId=null;
  renderCanvas();
  const p=document.getElementById('lb-props-body');
  if(p) p.innerHTML='<div style="color:var(--text3);font-size:13px;">Select a block to edit properties.</div>';
};

// Image drag-and-drop onto canvas
window.canvasDragOver = (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; };
window.canvasDrop = (e)=>{
  e.preventDefault();
  const files = [...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  files.forEach(file=>{ addBlock('image'); readImageFile(file, lbBlocks[lbBlocks.length-1].id); });
};

window.triggerImageUpload = (id)=>{ const inp=document.getElementById(`img-inp-${id}`)||document.getElementById(`img-inp-props-${id}`); if(inp) inp.click(); };
window.handleImageFile = (e, id)=>{ const file=e.target.files?.[0]; if(file) readImageFile(file,id); };

function readImageFile(file, blockId){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const block = lbBlocks.find(b=>b.id===blockId);
    if(!block) return;
    block.src = ev.target.result;
    block.alt = file.name.replace(/\.[^.]+$/,'');
    renderCanvas();
    selectBlock(blockId);
    toast('Image added','success');
  };
  reader.readAsDataURL(file);
}

// Drag-to-reorder blocks
function highlightDragOver(){
  document.querySelectorAll('.lb-block').forEach(el=>el.style.borderTopColor=el.dataset.bid===lbDragOverId?'var(--white)':'transparent');
}
function clearDragOver(){
  document.querySelectorAll('.lb-block').forEach(el=>el.style.borderTopColor='transparent');
}
function dropBlock(targetId){
  if(!lbDragId||lbDragId===targetId) return;
  const fromIdx=lbBlocks.findIndex(b=>b.id===lbDragId);
  const toIdx=lbBlocks.findIndex(b=>b.id===targetId);
  if(fromIdx<0||toIdx<0) return;
  const [moved]=lbBlocks.splice(fromIdx,1);
  lbBlocks.splice(toIdx,0,moved);
  lbDragId=null; lbDragOverId=null;
  renderCanvas();
}

// Preview lesson
window.previewLesson = ()=>{
  const title = document.getElementById('lb-title')?.value||'Untitled';
  const html = serializeBlocks();
  openModal(`Preview: ${title}`,`
    <div class="lesson-viewer" style="max-height:65vh;overflow-y:auto;">
      <div class="lesson-viewer-body">${html}</div>
    </div>`,'');
  // Widen modal for preview
  document.getElementById('modal-box').style.maxWidth='780px';
};

function serializeBlocks(){
  return lbBlocks.map(b=>{
    switch(b.type){
      case 'heading': return `<${b.level||'h2'}>${b.text}</${b.level||'h2'}>`;
      case 'text': return `<p>${b.text}</p>`;
      case 'image': return b.src?`<figure style="margin:16px 0;"><img src="${b.src}" alt="${b.alt||''}" style="width:${b.width||'100%'};max-width:100%;border-radius:4px;">${b.caption?`<figcaption style="font-size:12px;color:var(--text3);text-align:center;margin-top:6px;">${b.caption}</figcaption>`:''}</figure>`:'';
      case 'code': return `<pre><code class="lang-${b.lang||'text'}">${b.text}</code></pre>`;
      case 'callout': return `<div class="callout callout-${b.variant||'info'}" style="border-left:3px solid ${b.variant==='warn'?'var(--warn)':b.variant==='danger'?'var(--danger)':b.variant==='success'?'var(--success)':'var(--white)'};padding:12px 16px;background:var(--surface2);border-radius:0 4px 4px 0;margin:12px 0;">${b.text}</div>`;
      case 'list': return `<ul>${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
      case 'divider': return `<hr>`;
      case 'video': {
        const yt=b.url?.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
        const vm=b.url?.match(/vimeo\.com\/(\d+)/);
        if(yt) return `<div style="position:relative;padding-bottom:56.25%;margin:16px 0;"><iframe src="https://www.youtube.com/embed/${yt[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div>`;
        if(vm) return `<div style="position:relative;padding-bottom:56.25%;margin:16px 0;"><iframe src="https://player.vimeo.com/video/${vm[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div>`;
        return b.url?`<p style="color:var(--warn);">⚠ Unsupported video URL</p>`:'';
      }
      case 'quiz': return `<div class="quiz-block" data-correct="${b.correct||0}" style="background:var(--surface2);padding:16px;border-radius:4px;margin:12px 0;">
        <div style="font-weight:600;margin-bottom:10px;">${b.question}</div>
        ${(b.options||[]).map((opt,i)=>`<div class="quiz-opt" data-idx="${i}" onclick="checkQuizAnswer(this,${b.correct||0})" style="padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;cursor:pointer;font-size:13px;">${opt}</div>`).join('')}
        ${b.explanation?`<div class="quiz-explain" style="display:none;margin-top:8px;font-size:12px;color:var(--text3);font-style:italic;">${b.explanation}</div>`:''}
      </div>`;
      default: return '';
    }
  }).join('\n');
}

window.checkQuizAnswer = (el, correct)=>{
  const container=el.closest('.quiz-block');
  container.querySelectorAll('.quiz-opt').forEach((opt,i)=>{
    opt.style.borderColor=i===correct?'var(--success)':'var(--border)';
    opt.style.color=i===correct?'var(--success)':parseInt(opt.dataset.idx)===parseInt(el.dataset.idx)?'var(--danger)':'';
    opt.style.cursor='default';
    opt.onclick=null;
  });
  const explain=container.querySelector('.quiz-explain');
  if(explain) explain.style.display='block';
};

  if(!classId||!title){ toast('Select a class and add a title','error'); return; }

  const content = serializeBlocks();
  const editId = window._editingLessonId;
  if(editId){
    await updateDoc(doc(db,'lessons',editId),{title,type,duration:dur,order,content,points,blocks:JSON.stringify(lbBlocks),updatedAt:serverTimestamp()});
    toast(`"${title}" updated!`,'success');
  } else {
    await addDoc(collection(db,'lessons'),{classId,title,type,duration:dur,order,content,points,blocks:JSON.stringify(lbBlocks),teacherId:currentUser.uid,createdAt:serverTimestamp()});
    toast(`"${title}" published!`,'success');

window.editLesson = async(lessonId)=>{
  const s=await getDoc(doc(db,'lessons',lessonId));
  if(!s.exists()) return;
  const l=s.data();
  // Navigate to lesson builder and populate
  tNav('add-lesson');
  await loadAddLessonClassDropdown();
  setTimeout(()=>{
    const titleEl=document.getElementById('lb-title');
    const classEl=document.getElementById('lb-class');
    const typeEl=document.getElementById('lb-type');
    const durEl=document.getElementById('lb-dur');
    const orderEl=document.getElementById('lb-order');
    const ptsEl=document.getElementById('lb-points');
    if(titleEl) titleEl.value=l.title||'';
    if(classEl) classEl.value=l.classId||'';
    if(typeEl) typeEl.value=l.type||'Lesson';
    if(durEl) durEl.value=l.duration||'';
    if(orderEl) orderEl.value=l.order||1;
    if(ptsEl) ptsEl.value=l.points||10;
    // Load blocks from saved JSON or fall back to a single text block
    try { lbBlocks = l.blocks ? JSON.parse(l.blocks) : [{...blockDefaults('text'), text:l.content||''}]; }
    catch(e){ lbBlocks=[{...blockDefaults('text'),text:l.content||''}]; }
    lbSelectedId=null;
    renderCanvas();
    // Override publish to update instead of create
    window._editingLessonId = lessonId;
    toast('Lesson loaded in builder','info');
  },150);
};

window.insertTag = (id, open, close)=>{
  const ta=document.getElementById(id);
  const s=ta.selectionStart, e=ta.selectionEnd;
  const val=ta.value;
  ta.value=val.slice(0,s)+open+val.slice(s,e)+close+val.slice(e);
  ta.focus(); ta.selectionStart=s+open.length; ta.selectionEnd=e+open.length;
};

async function loadTeacherMessages(){
  const el=document.getElementById('msg-thread-list');
  if(!el) return;
  el.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px;">Loading...</div>';
  const q=query(collection(db,'messages'));
  const snaps=await getDocs(q);
  const myThreads=snaps.docs.filter(d=>{
    const parts=d.data().participants||[];
    return parts.includes(currentUser.uid);
  });
  if(!myThreads.length){ el.innerHTML='<div style="padding:16px;font-size:13px;color:var(--text3);">No conversations yet.</div>'; return; }
  window._msgThreads=myThreads.map(d=>({id:d.id,...d.data()}));
  renderMsgThreads(window._msgThreads);
}

function renderMsgThreads(threads){
  const el=document.getElementById('msg-thread-list');
  if(!el) return;
  el.innerHTML=threads.map(t=>{
    const otherId=(t.participants||[]).find(p=>p!==currentUser.uid);
    const otherName=t.participantNames?.[otherId]||'Student';
    return `<div class="msg-thread" onclick="openTeacherChat('${t.id}','${otherId}','${otherName.replace(/'/g,"\\'")}')">
      <div class="msg-thread-head"><div class="msg-thread-name">${otherName}</div><div class="msg-thread-time">${timeAgo(t.lastMessageTime)}</div></div>
      <div class="msg-thread-preview">${t.lastMessage||'...'}</div>
    </div>`;
  }).join('');
}

window.searchMsgThreads=()=>{
  const q=document.getElementById('msg-search').value.toLowerCase();
  if(!window._msgThreads) return;
  const filtered=window._msgThreads.filter(t=>{
    const otherId=(t.participants||[]).find(p=>p!==currentUser.uid);

    return name.toLowerCase().includes(q);

    external:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
    calendar:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    ai:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><path d="M18 2v4h4"/></svg>`,
    img:`<svg ${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,

  return icons[name]||'';
}

// ══════════════════════════════════════════════════════════
// DOCUMENTATION VIEWER
// ══════════════════════════════════════════════════════════
let _docLessonId = null;
let _docClassId  = null;

window.openDocViewer = function(lesson, classId, isDone) {
  _docLessonId = lesson.id;
  _docClassId  = classId;

  // Title bar
  document.getElementById('doc-viewer-title').textContent = lesson.title;

  // Complete button state
  const completeBtn = document.getElementById('doc-complete-btn');
  if(isDone){
    completeBtn.textContent = '✓ Completed';
    completeBtn.classList.add('done');
    completeBtn.disabled = true;
  } else {
    completeBtn.textContent = 'Mark Complete';
    completeBtn.classList.remove('done');
    completeBtn.disabled = false;
  }

  // Build content HTML
  const rawContent = lesson.content || '<p>No content yet.</p>';
  const contentEl = document.getElementById('doc-content-area');

  // Hero header
  const typeColors = {Lesson:'var(--white)',Lab:'var(--warn)',Quiz:'var(--success)',Project:'var(--warn)',Review:'var(--text3)'};
  contentEl.innerHTML = `
    <div class="doc-meta-row">
      <span class="badge badge-white">${lesson.type||'Lesson'}</span>
      ${lesson.duration ? `<span style="font-family:var(--mono);font-size:11px;color:var(--text3);">⏱ ${lesson.duration}</span>` : ''}
      ${isDone ? '<span class="badge badge-success">✓ Completed</span>' : ''}
    </div>
    <div class="doc-hero-title">${lesson.title}</div>
    ${lesson.description ? `<div class="doc-hero-desc">${lesson.description}</div>` : ''}
    <div class="doc-hero-divider"></div>
    <div class="doc-content" id="doc-main-content">${processDocContent(rawContent)}</div>`;

  // Build TOC from headings
  buildDocTOC();

  // Rail info
  renderDocRail(lesson, isDone);

  // Reset scroll & progress
  const body = document.getElementById('doc-body');
  if(body) body.scrollTop = 0;
  updateDocReadingProgress(0);

  // Open overlay
  const viewer = document.getElementById('doc-viewer');
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Back button
  document.getElementById('doc-back-btn').onclick = closeDocViewer;
};

function processDocContent(html){
  // Make quiz blocks interactive
  let processed = html;

  // Add IDs to h2/h3 for TOC scrolling
  let h2count = 0, h3count = 0;
  processed = processed.replace(/<h2([^>]*)>/gi, (m,attrs) => {
    h2count++;
    return `<h2${attrs} id="doc-h2-${h2count}">`;
  });
  processed = processed.replace(/<h3([^>]*)>/gi, (m,attrs) => {
    h3count++;
    return `<h3${attrs} id="doc-h3-${h3count}">`;
  });

  // Upgrade images to figures with lightbox
  processed = processed.replace(/<img([^>]+)>/gi, (m, attrs) => {
    const srcMatch = attrs.match(/src="([^"]+)"/i);
    const altMatch = attrs.match(/alt="([^"]*)"/i);
    const src = srcMatch ? srcMatch[1] : '';
    const alt = altMatch ? altMatch[1] : '';
    if(!src) return m;
    return `<figure><img ${attrs} onclick="openLightbox('${src.replace(/'/g,"\\'")}','${alt.replace(/'/g,"\\'")}')"><figcaption>${alt}</figcaption></figure>`;
  });

  // Activate quiz blocks
  processed = processed.replace(/class="quiz-opt correct-answer"/gi, 'class="quiz-opt" data-correct="true"');
  processed = processed.replace(/<div class="quiz-block">/gi, '<div class="quiz-block" data-answered="false">');

  // Add code language labels
  processed = processed.replace(/<pre><code class="lang-(\w+)">/gi, (m, lang) =>
    `<pre><span class="code-lang">${lang}</span><code class="lang-${lang}">`
  );

  return processed;
}

function buildDocTOC(){
  const tocEl = document.getElementById('doc-toc-list');
  if(!tocEl) return;
  const content = document.getElementById('doc-main-content');
  if(!content){ tocEl.innerHTML=''; return; }

  const headings = content.querySelectorAll('h2, h3');
  if(!headings.length){ tocEl.innerHTML='<div style="font-size:12px;color:var(--text3);">No sections</div>'; return; }

  tocEl.innerHTML = Array.from(headings).map((h,i) => {
    const level = h.tagName.toLowerCase();
    const text = h.textContent.trim();
    const id = h.id || `doc-head-${i}`;
    if(!h.id) h.id = id;
    return `<div class="doc-toc-item ${level}" onclick="scrollToDocSection('${id}')" data-id="${id}">${text}</div>`;
  }).join('');
}

window.scrollToDocSection = function(id){
  const el = document.getElementById(id);
  const body = document.getElementById('doc-body');
  if(!el||!body) return;
  const offset = el.offsetTop - 24;
  body.scrollTo({top: offset, behavior:'smooth'});
};

window.onDocScroll = function(){
  const body = document.getElementById('doc-body');
  if(!body) return;
  const scrollTop = body.scrollTop;
  const scrollHeight = body.scrollHeight - body.clientHeight;
  const pct = scrollHeight > 0 ? Math.round((scrollTop/scrollHeight)*100) : 0;
  updateDocReadingProgress(pct);
  highlightActiveTOCItem();
};

function updateDocReadingProgress(pct){
  const fill = document.getElementById('doc-reading-fill');
  const pctEl = document.getElementById('doc-read-pct');
  const railFill = document.getElementById('doc-rail-fill');
  const railPct = document.getElementById('doc-rail-pct');
  if(fill) fill.style.width = pct+'%';
  if(pctEl) pctEl.textContent = pct+'%';
  if(railFill) railFill.style.width = pct+'%';
  if(railPct) railPct.textContent = pct+'% read';
}

function highlightActiveTOCItem(){
  const body = document.getElementById('doc-body');
  const content = document.getElementById('doc-main-content');
  if(!body||!content) return;
  const scrollTop = body.scrollTop + 60;
  const headings = Array.from(content.querySelectorAll('h2,h3'));
  let activeId = null;
  for(let i=headings.length-1; i>=0; i--){
    if(headings[i].offsetTop <= scrollTop){ activeId = headings[i].id; break; }
  }
  document.querySelectorAll('.doc-toc-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.id === activeId);
  });
}

function renderDocRail(lesson, isDone){
  const rail = document.getElementById('doc-rail-body');
  if(!rail) return;
  rail.innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;">Status</div>
      <div style="font-size:13px;color:${isDone?'var(--success)':'var(--text2)'};">
        ${isDone ? '✓ Completed' : 'In progress'}
      </div>
    </div>
    ${lesson.duration ? `
    <div style="margin-bottom:16px;">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;">Duration</div>
      <div style="font-size:13px;color:var(--text2);">${lesson.duration}</div>
    </div>` : ''}
    ${lesson.points ? `
    <div style="margin-bottom:16px;">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;">Points</div>
      <div style="font-size:18px;font-weight:700;">${lesson.points}</div>
    </div>` : ''}
    <div style="height:1px;background:var(--border);margin:16px 0;"></div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Reading Progress</div>
    <div class="doc-reading-bar" style="margin-bottom:4px;">
      <div class="doc-reading-fill" id="doc-rail-fill" style="width:0%;"></div>
    </div>
    <div id="doc-rail-pct" style="font-family:var(--mono);font-size:10px;color:var(--text3);">0% read</div>`;
}

window.closeDocViewer = function(){
  document.getElementById('doc-viewer').classList.remove('open');
  document.body.style.overflow = '';
  _docLessonId = null;
  _docClassId = null;
};

window.markDocLessonComplete = async function(){
  if(!_docLessonId||!_docClassId) return;
  const ref = doc(db,'progress',`${currentUser.uid}_${_docClassId}`);
  await setDoc(ref,{userId:currentUser.uid,classId:_docClassId,completedLessons:arrayUnion(_docLessonId),updatedAt:serverTimestamp()},{merge:true});
  await updateDoc(doc(db,'users',currentUser.uid),{points:(userProfile.points||0)+10});
  userProfile.points = (userProfile.points||0)+10;

  const btn = document.getElementById('doc-complete-btn');
  if(btn){ btn.textContent='✓ Completed'; btn.classList.add('done'); btn.disabled=true; }
  toast('Lesson complete! +10 points','success');
  pushNotif('Lesson Complete','You earned 10 points!');

  // Refresh the lesson list in background
  loadClassLessons(_docClassId);
  loadClassProgress(_docClassId);
};

// Quiz interaction inside doc viewer
document.addEventListener('click', e => {
  const opt = e.target.closest('.doc-content .quiz-opt');
  if(!opt) return;
  const block = opt.closest('.quiz-block');
  if(!block || block.dataset.answered === 'true') return;
  block.dataset.answered = 'true';

  const isCorrect = opt.dataset.correct === 'true';
  block.querySelectorAll('.quiz-opt').forEach(o => {
    o.style.pointerEvents = 'none';
    if(o.dataset.correct === 'true') o.classList.add('correct');
    else if(o === opt && !isCorrect) o.classList.add('wrong');
  });

  const explain = block.querySelector('.quiz-explain');
  if(explain) explain.style.display = 'block';
  toast(isCorrect ? '✓ Correct!' : 'Not quite — see the explanation below', isCorrect?'success':'info');
});

// ── LIGHTBOX ──
window.openLightbox = function(src, alt){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  if(!lb||!img) return;
  img.src = src;
  img.alt = alt||'';
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('open');
  if(!document.getElementById('doc-viewer').classList.contains('open')){
    document.body.style.overflow = '';
  }
};

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if(document.getElementById('doc-viewer').classList.contains('open')) closeDocViewer();
  }
});

document.addEventListener('click', e=>{
  if(!e.target.closest('#notif-panel')&&!e.target.closest('#notif-btn')){
    document.getElementById('notif-panel')?.classList.remove('open');
  }
});
