<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── RESET & BASE ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --white:#FFFFFF;--off-white:#F0F0F0;--grey:#888888;--mid-grey:#555555;
  --surface:#111111;--surface2:#1A1A1A;--surface3:#222222;
  --border:#2A2A2A;--border-mid:#333333;--canvas:#0A0A0A;
  --text:#FFFFFF;--text2:#AAAAAA;--text3:#666666;
  --accent:#FFFFFF;--danger:#FF4444;--success:#44FF88;--warn:#FFCC44;
  --font:'Space Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --radius:4px;--radius-lg:8px;
  --trans:cubic-bezier(.2,0,0,1);
}
html,body{height:100%;font-family:var(--font);background:var(--canvas);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}
input,textarea,select{font-family:var(--font);outline:none;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:2px;}

/* ─── AUTH SCREEN ─── */
#auth-screen{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:100;}
.auth-wrap{width:100%;max-width:420px;padding:0 24px;}
.auth-logo{font-size:36px;font-weight:700;letter-spacing:-.04em;margin-bottom:8px;}
.auth-tagline{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:40px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:28px;}
.auth-tab{font-size:13px;font-weight:600;color:var(--text3);padding:8px 0;margin-right:24px;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;}
.auth-tab.active{color:var(--white);border-bottom-color:var(--white);}
.auth-field{margin-bottom:16px;}
.auth-field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:6px;}
.auth-field input,.auth-field select{width:100%;background:var(--surface);border:none;color:var(--white);padding:10px 14px;font-size:14px;border-radius:var(--radius);}
.auth-field input:focus,.auth-field select:focus{border-color:var(--mid-grey);}
.auth-field select option{background:var(--surface);}
.btn-primary{width:100%;background:var(--white);color:var(--canvas);font-weight:700;font-size:14px;padding:14px;border-radius:var(--radius);margin-top:8px;}
.btn-primary:hover{opacity:.88;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.auth-divider span{font-family:var(--mono);font-size:10px;color:var(--text3);}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-google{width:100%;background:var(--surface);border:none;color:var(--white);font-size:14px;padding:11px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{background:var(--surface2);}
.auth-err{font-family:var(--mono);font-size:11px;color:var(--danger);margin-top:10px;min-height:16px;}

/* ─── APP SHELL ─── */
#app{display:none;height:100vh;flex-direction:column;}
#app.show{display:flex;}

/* ─── TOPBAR ─── */
.topbar{height:52px;background:var(--canvas);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;position:relative;z-index:50;}
.topbar-logo{font-size:18px;font-weight:700;letter-spacing:-.03em;}
.topbar-role{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;background:var(--surface);padding:3px 8px;border-radius:var(--radius);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.topbar-user{font-family:var(--mono);font-size:11px;color:var(--text2);}
.topbar-notif{position:relative;background:transparent;border:none;color:var(--text2);padding:5px 8px;border-radius:var(--radius);font-size:13px;}
.topbar-notif:hover{color:var(--white);}
.notif-badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:var(--danger);border-radius:50%;font-size:9px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;font-weight:600;}
.btn-signout{background:transparent;border:none;color:var(--text3);font-size:12px;padding:5px 10px;border-radius:var(--radius);}
.btn-signout:hover{color:var(--white);}

/* ─── MAIN LAYOUT ─── */
.main-layout{flex:1;display:flex;overflow:hidden;}

/* ─── SIDEBAR ─── */
.sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden;}
.sidebar-section{padding:12px 8px 4px;}
.sidebar-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;padding:0 8px;margin-bottom:6px;}
.sidebar-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:1px;}
.sidebar-item:hover{background:var(--surface2);color:var(--white);}
.sidebar-item.active{background:var(--white);color:var(--canvas);}
.sidebar-item svg{width:15px;height:15px;flex-shrink:0;}
.sidebar-bottom{margin-top:auto;padding:12px;}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;background:var(--canvas);}
.panel{display:none;height:100%;}
.panel.active{display:flex;flex-direction:column;}
.panel-header{padding:24px 28px 0;flex-shrink:0;}
.panel-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.panel-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.1em;}
.panel-body{padding:20px 28px;flex:1;overflow-y:auto;}

/* ─── TABS ─── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;flex-shrink:0;}
.tab{font-size:13px;font-weight:600;color:var(--text3);padding:10px 0;margin-right:24px;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--white);border-bottom-color:var(--white);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ─── CARDS ─── */
.card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:20px;}
.card-sm{background:var(--surface);border:none;border-radius:var(--radius);padding:14px 16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:600;color:var(--white);}
.card-meta{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em;}

/* ─── STAT GRID ─── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:18px 20px;}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.stat-val{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--white);}
.stat-delta{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px;}

/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);}
.tbl td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--surface2);}
.tbl-wrap{background:var(--surface);border:none;border-radius:var(--radius-lg);overflow:hidden;}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:13px;font-weight:600;padding:10px 18px;border-radius:var(--radius);cursor:pointer;border:none;}
.btn-white{background:var(--white);color:var(--canvas);}
.btn-white:hover{opacity:.85;}
.btn-ghost{background:transparent;border:none;color:var(--text2);}
.btn-ghost:hover{background:var(--white);color:var(--canvas);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.82;}
.btn-success{background:var(--success);color:var(--canvas);}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-xs{padding:5px 10px;font-size:11px;}

/* ─── FORM ELEMENTS ─── */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:6px;}
.form-input,.form-textarea,.form-select{width:100%;background:var(--surface);border:none;color:var(--white);padding:9px 12px;font-size:14px;border-radius:var(--radius);}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--mid-grey);}
.form-textarea{resize:vertical;min-height:80px;}
.form-select option{background:var(--surface);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-hint{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:5px;}

/* ─── PROGRESS BAR ─── */
.progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--white);border-radius:2px;transition:width .4s var(--trans);}
.progress-fill.warn{background:var(--warn);}
.progress-fill.success{background:var(--success);}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:2px;font-weight:600;}
.badge-white{background:rgba(255,255,255,.1);color:var(--white);}
.badge-success{background:rgba(68,255,136,.12);color:var(--success);}
.badge-warn{background:rgba(255,204,68,.12);color:var(--warn);}
.badge-danger{background:rgba(255,68,68,.12);color:var(--danger);}
.badge-grey{background:var(--surface2);color:var(--text3);}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:none;border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:700;letter-spacing:-.02em;}
.modal-close{background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* ─── TOAST ─── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:none;border-radius:var(--radius);padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:240px;animation:toastIn .25s var(--trans);box-shadow:0 4px 24px rgba(0,0,0,.6);}
.toast.success{border-left:3px solid var(--success);}
.toast.error{border-left:3px solid var(--danger);}
.toast.info{border-left:3px solid var(--white);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ─── EMPTY STATE ─── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--text3);}
.empty-state svg{margin-bottom:16px;opacity:.3;}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-state p{font-size:13px;max-width:260px;line-height:1.6;}

/* ─── STUDENT CLASSES ─── */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.class-card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:20px;cursor:pointer;}
.class-card:hover{background:var(--surface2);}
.class-card-code{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;}
.class-card-name{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
.class-card-teacher{font-size:12px;color:var(--text2);margin-bottom:14px;}
.class-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}

/* ─── LESSON LIST ─── */
.lesson-item{background:var(--surface);border:none;border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:14px;}
.lesson-item:hover{background:var(--surface2);}
.lesson-num{font-family:var(--mono);font-size:11px;color:var(--text3);width:28px;flex-shrink:0;}
.lesson-info{flex:1;}
.lesson-title{font-size:14px;font-weight:600;margin-bottom:2px;}
.lesson-meta{font-family:var(--mono);font-size:10px;color:var(--text3);}
.lesson-status{flex-shrink:0;}

/* ─── LESSON VIEWER ─── */
.lesson-viewer{max-width:720px;}
.lesson-viewer-header{margin-bottom:24px;}
.lesson-viewer-body{font-size:15px;line-height:1.75;color:var(--text2);}
.lesson-viewer-body h3{font-size:17px;font-weight:700;color:var(--white);margin:20px 0 10px;}
.lesson-viewer-body p{margin-bottom:14px;}
.lesson-viewer-body code{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:2px 6px;border-radius:2px;color:var(--white);}
.lesson-viewer-body pre{background:var(--surface2);border:none;border-radius:var(--radius);padding:16px;margin:12px 0;overflow-x:auto;}
.lesson-viewer-body pre code{background:none;padding:0;}

/* ─── CHAT / MESSAGES ─── */
.chat-wrap{display:flex;flex-direction:column;height:100%;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:70%;padding:10px 14px;border-radius:var(--radius);}
.chat-msg.sent{background:var(--white);color:var(--canvas);align-self:flex-end;border-radius:var(--radius) var(--radius) 2px var(--radius);}
.chat-msg.recv{background:var(--surface2);color:var(--white);align-self:flex-start;border-radius:var(--radius) var(--radius) var(--radius) 2px;}
.chat-msg-meta{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px;}
.chat-input-wrap{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-input{flex:1;background:var(--surface2);border:none;color:var(--white);padding:9px 12px;border-radius:var(--radius);font-size:14px;}
.chat-input:focus{border-color:var(--mid-grey);}

/* ─── HELP / ACCORDION ─── */
.help-item{border-bottom:1px solid var(--border);}
.help-q{display:flex;align-items:center;justify-content:space-between;padding:14px 0;cursor:pointer;font-size:14px;font-weight:600;}
.help-q:hover{color:var(--text2);}
.help-a{padding:0 0 14px;font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.help-a.open{display:block;}
.help-chevron{transition:transform .2s;color:var(--text3);}
.help-chevron.open{transform:rotate(180deg);}

/* ─── ANALYTICS ─── */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px;}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.chart-bar{background:var(--surface2);width:100%;border-radius:2px 2px 0 0;position:relative;}
.chart-bar:hover{background:var(--mid-grey);}
.chart-bar-label{font-family:var(--mono);font-size:9px;color:var(--text3);}
.chart-bar-val{font-family:var(--mono);font-size:9px;color:var(--text3);position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;}

/* ─── NOTIFICATION PANEL ─── */
.notif-panel{position:absolute;top:52px;right:16px;width:320px;background:var(--surface);border:none;border-radius:var(--radius-lg);z-index:100;display:none;box-shadow:0 8px 40px rgba(0,0,0,.7);}
.notif-panel.open{display:block;}
.notif-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.notif-item:hover{background:var(--surface2);}
.notif-item:last-child{border-bottom:none;}
.notif-item-title{font-size:12px;font-weight:600;margin-bottom:2px;}
.notif-item-body{font-size:12px;color:var(--text2);}
.notif-item-time{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px;}

/* ─── JOIN CLASS ─── */
.join-wrap{max-width:400px;}
.join-input-row{display:flex;gap:8px;}

/* ─── RESPONSIVE ─── */
@media(max-width:768px){
  .sidebar{display:none;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .form-row{grid-template-columns:1fr;}
  .class-grid{grid-template-columns:1fr;}
}

/* ─── LESSON BUILDER ─── */
.lb-block{outline:none;user-select:none;}
.lb-block:hover > .lb-block-toolbar{display:flex!important;}
.lb-block[dragging]{opacity:.4;}
#lb-canvas{background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;}
#lb-canvas.drag-over{background-color:rgba(255,255,255,.02);}
.lb-drop-indicator{height:3px;background:var(--white);border-radius:2px;margin:4px 0;}

/* ─── DOCUMENTATION VIEWER ─── */
#doc-viewer{position:fixed;inset:0;z-index:300;background:var(--canvas);display:none;flex-direction:column;}
#doc-viewer.open{display:flex;}
.doc-topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;}
.doc-topbar-back{background:transparent;border:none;color:var(--text2);font-size:13px;padding:5px 12px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font);}
.doc-topbar-back:hover{color:var(--white);background:var(--surface2);}
.doc-topbar-title{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;}
.doc-topbar-progress{flex:1;max-width:200px;margin-left:auto;margin-right:8px;}
.doc-layout{flex:1;display:grid;grid-template-columns:240px 1fr 200px;overflow:hidden;}
.doc-toc{background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;overflow-y:auto;}
.doc-toc-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;}
.doc-toc-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius);font-size:13px;color:var(--text3);cursor:pointer;margin-bottom:2px;border-left:2px solid transparent;}
.doc-toc-item:hover{color:var(--text2);background:var(--surface2);}
.doc-toc-item.active{color:var(--white);border-left-color:var(--white);background:rgba(255,255,255,.05);}
.doc-toc-item.h2{font-weight:600;font-size:13px;}
.doc-toc-item.h3{padding-left:20px;font-size:12px;color:var(--text3);}
.doc-body{overflow-y:auto;padding:48px 64px;background:var(--canvas);scroll-behavior:smooth;}
.doc-meta-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.doc-hero-title{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px;color:var(--white);}
.doc-hero-desc{font-size:15px;color:var(--text2);margin-bottom:28px;line-height:1.6;max-width:640px;}
.doc-hero-divider{height:1px;background:var(--border);margin-bottom:32px;}
.doc-content{max-width:700px;}
.doc-content h2{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--white);margin:40px 0 14px;padding-top:40px;border-top:1px solid var(--border);scroll-margin-top:20px;}
.doc-content h2:first-child{margin-top:0;padding-top:0;border-top:none;}
.doc-content h3{font-size:16px;font-weight:700;color:var(--white);margin:24px 0 10px;scroll-margin-top:20px;}
.doc-content h4{font-size:13px;font-weight:700;color:var(--mid-grey);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.08em;}
.doc-content p{font-size:15px;color:var(--text2);line-height:1.82;margin-bottom:16px;}
.doc-content ul,.doc-content ol{padding-left:24px;margin-bottom:16px;}
.doc-content li{font-size:15px;color:var(--text2);line-height:1.75;margin-bottom:6px;}
.doc-content strong{color:var(--white);font-weight:700;}
.doc-content em{color:var(--text2);font-style:italic;}
.doc-content code{font-family:var(--mono);font-size:13px;background:var(--surface2);color:var(--white);padding:2px 7px;border-radius:3px;}
.doc-content pre{background:var(--surface2);border:none;border-radius:var(--radius-lg);padding:20px 24px;margin:16px 0;overflow-x:auto;position:relative;}
.doc-content pre .code-lang{position:absolute;top:8px;right:12px;font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;}
.doc-content pre code{background:none;padding:0;font-size:13px;line-height:1.7;border:none;color:var(--off-white);}
.doc-content blockquote,.doc-content .callout{border-radius:0 var(--radius-lg) var(--radius-lg) 0;padding:14px 20px;margin:20px 0;}
.doc-content blockquote{border-left:3px solid var(--mid-grey);background:var(--surface);}
.doc-content blockquote p,.doc-content blockquote{color:var(--text2);}
.doc-content figure{margin:24px 0;}
.doc-content figure img{width:100%;border-radius:var(--radius-lg);cursor:zoom-in;display:block;}
.doc-content figure img:hover{opacity:.88;}
.doc-content figcaption{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center;margin-top:8px;letter-spacing:.05em;}
.doc-content .quiz-block{background:var(--surface2);border:none;border-radius:var(--radius-lg);padding:22px;margin:24px 0;}
.doc-content .quiz-question{font-size:15px;font-weight:700;color:var(--white);margin-bottom:14px;line-height:1.5;}
.doc-content .quiz-opt{padding:11px 14px;border:none;border-radius:var(--radius);margin-bottom:8px;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;gap:10px;background:var(--surface2);}
.doc-content .quiz-opt:hover{color:var(--white);background:var(--surface3);}
.doc-content .quiz-opt.correct{border-color:var(--success);color:var(--success);background:rgba(68,255,136,.07);}
.doc-content .quiz-opt.wrong{border-color:var(--danger);color:var(--danger);background:rgba(255,68,68,.07);}
.doc-content .quiz-opt-letter{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--mono);}
.doc-content .quiz-explain{font-size:13px;color:var(--text3);margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none;line-height:1.6;}
/* Doc right rail */
.doc-rail{background:var(--surface);border-left:1px solid var(--border);padding:24px 16px;overflow-y:auto;}
.doc-rail-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;}
.doc-reading-bar{height:3px;background:var(--surface2);border-radius:2px;margin-bottom:20px;overflow:hidden;}
.doc-reading-fill{height:100%;background:var(--white);border-radius:2px;transition:width .2s;}
.doc-complete-btn{width:100%;background:var(--white);color:var(--canvas);font-weight:700;font-size:13px;padding:10px;border-radius:var(--radius);cursor:pointer;border:none;font-family:var(--font);transition:opacity .15s;margin-top:12px;}
.doc-complete-btn:hover{opacity:.88;}
.doc-complete-btn:disabled{opacity:.4;cursor:not-allowed;}
.doc-complete-btn.done{background:var(--success);color:var(--canvas);}

/* ─── IMAGE LIGHTBOX ─── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:600;display:none;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .15s ease;}
#lightbox.open{display:flex;}
#lightbox img{max-width:88vw;max-height:86vh;object-fit:contain;border-radius:var(--radius-lg);}
#lightbox-close{position:fixed;top:18px;right:22px;color:var(--text2);font-size:28px;cursor:pointer;background:none;border:none;line-height:1;}
#lightbox-close:hover{color:var(--white);}

/* ─── AI LESSON CREATOR ─── */
.ai-creator{max-width:800px;}
.ai-step{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;}
.ai-step-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.ai-step-num{width:26px;height:26px;background:var(--white);color:var(--canvas);border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-step-title{font-size:14px;font-weight:700;letter-spacing:-.01em;}
.ai-generating{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--surface2);border-radius:var(--radius);margin-top:12px;}
.ai-generating-text{font-size:13px;color:var(--text2);}
.ai-dots span{display:inline-block;width:5px;height:5px;background:var(--white);border-radius:50%;animation:dot-bounce .9s infinite;margin:0 2px;}
.ai-dots span:nth-child(2){animation-delay:.2s;}
.ai-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.ai-outline-section{background:var(--surface2);border:none;border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;}
.ai-outline-idx{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px;width:20px;flex-shrink:0;}
.ai-outline-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:2px;}
.ai-outline-desc{font-size:12px;color:var(--text3);line-height:1.5;}
.ai-progress-wrap{margin-top:16px;}
.ai-progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.ai-progress-fill{height:100%;background:var(--white);border-radius:2px;transition:width .5s ease;}
.ai-progress-text{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px;}
.ai-preview-card{background:var(--surface2);border:none;border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;}
.ai-preview-section-title{font-size:13px;font-weight:700;color:var(--white);margin-bottom:4px;}
.ai-preview-section-body{font-size:12px;color:var(--text3);line-height:1.5;}

/* ─── TEACHER DASHBOARD ─── */
.db-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0;}
.db-header-left{}
.db-header-title{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.db-header-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:5px;}
.db-header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.db-action-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:none;color:var(--text);font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--radius);cursor:pointer;font-family:var(--font);}
.db-action-btn:hover{background:var(--white);color:var(--canvas);}
.db-action-btn svg{flex-shrink:0;}
.db-class-select{background:var(--surface);border:none;color:var(--white);font-size:13px;padding:7px 12px;border-radius:var(--radius);font-family:var(--font);cursor:pointer;}
.db-class-select:focus{outline:none;border-color:var(--mid-grey);}
/* Score summary card */
.db-score-card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:22px 24px;display:flex;align-items:center;gap:32px;}
.db-score-main{}
.db-score-label{font-size:12px;color:var(--text3);margin-bottom:6px;}
.db-score-pct{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.db-score-pct.good{color:var(--success);}
.db-score-pct.warn{color:var(--warn);}
.db-score-pct.bad{color:var(--danger);}
.db-score-pct.zero{color:var(--success);}
.db-score-sub{font-size:12px;color:var(--text3);margin-top:4px;}
.db-score-divider{width:1px;height:48px;background:var(--border);}
.db-score-assigned{}
.db-score-assigned-num{font-size:36px;font-weight:700;letter-spacing:-.02em;}
.db-score-assigned-label{font-size:12px;color:var(--text3);margin-top:2px;}
.db-score-trophy{font-size:32px;opacity:.25;}
/* Status tiles */
.db-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.db-status-tile{border-radius:var(--radius-lg);padding:18px 20px;color:#fff;}
.db-status-tile-num{font-size:36px;font-weight:700;line-height:1;margin-bottom:8px;}
.db-status-tile-label{font-size:13px;font-weight:500;line-height:1.4;}
.db-tile-green{background:#3d9a4a;}
.db-tile-yellow{background:#b8860b;}
.db-tile-orange{background:#b05a2a;}
/* Student progress table */
.db-progress-section{background:var(--surface);border:none;border-radius:var(--radius-lg);overflow:hidden;}
.db-progress-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.db-progress-title{font-size:15px;font-weight:700;}
.db-progress-count{font-family:var(--mono);font-size:11px;color:var(--text3);}
.db-ptbl{width:100%;border-collapse:collapse;}
.db-ptbl th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;text-align:left;padding:10px 16px;border-bottom:1px solid var(--border);font-weight:500;}
.db-ptbl td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.db-ptbl tr:last-child td{border-bottom:none;}
.db-ptbl tr:hover td{background:rgba(255,255,255,.02);}
.db-student-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--white);flex-shrink:0;}
.db-student-name{font-weight:600;font-size:13px;}
.db-student-email{font-size:11px;color:var(--text3);font-family:var(--mono);}
.db-prog-bar-wrap{display:flex;align-items:center;gap:10px;}
.db-prog-bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:80px;}
.db-prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.db-prog-pct{font-family:var(--mono);font-size:11px;min-width:30px;}
.db-prog-pct.zero{color:var(--danger);}
.db-prog-pct.full{color:var(--success);}
.db-cat-bubble{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--mono);}
.db-cat-orange{background:#c85a1a;color:#fff;}
.db-cat-grey{background:var(--surface2);color:var(--text3);}
.db-vcoin{background:#7a5c00;color:#f5c842;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;}
/* AI Panel */
.ai-key-notice{background:rgba(68,255,136,.08);border:1px solid rgba(68,255,136,.2);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--success);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* ─── COMPETITION MODE ─── */
.comp-header{padding:24px 28px 0;flex-shrink:0;}
.comp-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.comp-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:0;flex-shrink:0;padding:0 28px;}
.comp-tab{font-size:13px;font-weight:600;color:var(--text3);padding:10px 0;margin-right:24px;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;}
.comp-tab:hover{color:var(--text2);}
.comp-tab.active{color:var(--white);border-bottom-color:var(--white);}
.comp-body{flex:1;overflow-y:auto;padding:24px 28px;}
.comp-tab-panel{display:none;}
.comp-tab-panel.active{display:block;}
/* Team selector */
.team-selector{display:flex;align-items:center;gap:10px;}
.team-select{background:var(--surface);border:none;color:var(--white);font-size:14px;font-weight:600;padding:6px 12px;border-radius:var(--radius);font-family:var(--font);cursor:pointer;}
.team-select:focus{outline:none;border-color:var(--mid-grey);}
/* Event cards */
.event-card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:10px;display:flex;align-items:flex-start;gap:16px;}
.event-card:hover{border-color:var(--mid-grey);}
.event-date-badge{background:var(--surface2);border-radius:var(--radius);padding:8px 12px;text-align:center;flex-shrink:0;min-width:56px;}
.event-date-month{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;}
.event-date-day{font-size:22px;font-weight:700;line-height:1;}
.event-info{flex:1;}
.event-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.event-meta{font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:8px;}
.event-meta span{display:flex;align-items:center;gap:4px;}
.event-type-badge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:2px;text-transform:uppercase;flex-shrink:0;}
.event-upcoming{background:rgba(68,255,136,.1);color:var(--success);}
.event-past{background:var(--surface2);color:var(--text3);}
/* Team info grid */
.team-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.team-stat-card{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:16px 18px;}
.team-stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.team-stat-val{font-size:28px;font-weight:700;letter-spacing:-.02em;}
.team-stat-sub{font-size:11px;color:var(--text3);margin-top:3px;}
/* Links */
.link-card{background:var(--surface);border:none;border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.link-card:hover{background:var(--surface2);}
.link-favicon{width:28px;height:28px;background:var(--surface2);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.link-info{flex:1;min-width:0;}
.link-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-url{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Todos */
.todo-item{background:var(--surface);border:none;border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;}
.todo-item.done{opacity:.55;}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--text3);}
.todo-check{width:20px;height:20px;border:2px solid var(--surface3);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.todo-check:hover{border-color:var(--white);}
.todo-check.checked{background:var(--success);border-color:var(--success);}
.todo-title{font-size:14px;font-weight:600;flex:1;}
.todo-meta{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px;}
.todo-note{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6;padding-top:8px;border-top:1px solid var(--border);}
.todo-img{margin-top:8px;border-radius:var(--radius);max-width:100%;max-height:200px;object-fit:cover;cursor:zoom-in;}
.todo-completion{background:var(--surface2);border-radius:var(--radius);padding:10px 14px;margin-top:8px;font-size:13px;}
/* VEX API search */
.vex-search-row{display:flex;gap:8px;margin-bottom:16px;}
.vex-result-item{padding:12px 14px;border:none;border-radius:var(--radius);margin-bottom:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;background:var(--surface2);}
.vex-result-item:hover{background:var(--surface3);}

/* ─── ANIMATIONS ─── */
.fade-in{animation:fadeIn .3s var(--trans);}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TEACHER STUDENT LIST ─── */
.student-row-actions{display:flex;gap:6px;align-items:center;}
.grade-input{width:60px;background:var(--surface2);border:none;color:var(--white);padding:4px 8px;font-family:var(--mono);font-size:12px;border-radius:var(--radius);text-align:center;}
.grade-input:focus{border-color:var(--mid-grey);}

/* ─── ANNOUNCEMENT ─── */
.announcement{background:var(--surface);border-left:3px solid var(--white);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-bottom:10px;}
.announcement-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.announcement-title{font-size:13px;font-weight:700;}
.announcement-body{font-size:13px;color:var(--text2);line-height:1.6;}
.announcement-meta{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px;}

/* ─── TEACHER MESSAGE ─── */
.msg-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;}
.msg-thread{background:var(--surface2);border:none;border-radius:var(--radius);padding:12px 14px;cursor:pointer;}
.msg-thread:hover{border-color:var(--mid-grey);}
.msg-thread.unread{border-left:2px solid var(--white);}
.msg-thread-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.msg-thread-name{font-size:13px;font-weight:600;}
.msg-thread-preview{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-thread-time{font-family:var(--mono);font-size:9px;color:var(--text3);}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none;">
  <div class="auth-wrap">
    <div class="auth-logo">VEXIFY</div>
    <div class="auth-tagline">Where builders learn to build better.</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</div>
      <div class="auth-tab" onclick="switchAuthTab('signup')">Create Account</div>
    </div>

    <!-- SIGN IN -->
    <div id="tab-signin">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="si-email" placeholder="you@school.edu" autocomplete="email">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="signIn()">Sign In</button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-google" onclick="signInGoogle()">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="auth-err" id="si-err"></div>
    </div>

    <!-- SIGN UP -->
    <div id="tab-signup" style="display:none;">
      <div class="form-row">
        <div class="auth-field">
          <label>First Name</label>
          <input type="text" id="su-first" placeholder="Marcus">
        </div>
        <div class="auth-field">
          <label>Last Name</label>
          <input type="text" id="su-last" placeholder="Chen">
        </div>
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="su-email" placeholder="you@school.edu">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="su-pass" placeholder="Min. 8 characters">
      </div>
      <div class="auth-field">
        <label>I am a</label>
        <select id="su-role">
          <option value="student">Student</option>
          <option value="teacher">Teacher / Coach</option>
        </select>
      </div>
      <button class="btn-primary" onclick="signUp()">Create Account</button>

function ts2str(ts){ if(!ts) return ''; const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function timeAgo(ts){ if(!ts) return ''; const now=Date.now(), d=ts.toDate?ts.toDate():new Date(ts); const s=Math.floor((now-d)/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

window.switchAuthTab = (tab)=>{

window.signIn = async()=>{
  const email=document.getElementById('si-email').value.trim();
  const pass =document.getElementById('si-pass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){ document.getElementById('si-err').textContent = friendlyError(e.code); }
};

window.signUp = async()=>{
  const first=document.getElementById('su-first').value.trim();
  const last =document.getElementById('su-last').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass =document.getElementById('su-pass').value;
  const role =document.getElementById('su-role').value;
  if(!first||!last||!email||!pass){ document.getElementById('su-err').textContent='Fill in all fields.'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: `${first} ${last}` });
    await setDoc(doc(db,'users',cred.user.uid),{
      uid: cred.user.uid, firstName:first, lastName:last,
      displayName:`${first} ${last}`, email, role,
      createdAt:serverTimestamp(), enrolledClasses:[], points:0
    });
  } catch(e){ document.getElementById('su-err').textContent = friendlyError(e.code); }
};

window.signInGoogle = async()=>{
  try {
    const res = await signInWithPopup(auth, gprov);
    const uref = doc(db,'users',res.user.uid);
    const snap = await getDoc(uref);
    if(!snap.exists()){
      // New Google user - ask for role before creating profile
      window._pendingGoogleUser = res.user;
      showRolePicker();
    }
    // Existing user - onAuthStateChanged handles the rest
  } catch(e){
    const errEl = document.getElementById('si-err') || document.getElementById('su-err');
    if(errEl) errEl.textContent = friendlyError(e.code);
  }
};

window.completeGoogleSignup = async(role)=>{
  const user = window._pendingGoogleUser;
  if(!user) return;
  try {
    await setDoc(doc(db,'users',user.uid),{
      uid:user.uid, displayName:user.displayName,
      email:user.email, role,
      createdAt:serverTimestamp(), enrolledClasses:[], points:0,
      firstName:user.displayName?.split(' ')[0]||'',
      lastName:user.displayName?.split(' ').slice(1).join(' ')||''
    });
    window._pendingGoogleUser = null;
    // onAuthStateChanged will now fire and launch the app
  } catch(e){
    console.error('Signup error:', e);
  }
};

window.doSignOut = async()=>{
  activeListeners.forEach(u=>u());
  activeListeners=[];
  await signOut(auth);
};

function friendlyError(code){
  const map={'auth/user-not-found':'No account with that email.','auth/wrong-password':'Wrong password.',
    'auth/email-already-in-use':'Email already registered.','auth/weak-password':'Password must be 6+ characters.',
    'auth/invalid-email':'Invalid email address.','auth/popup-closed-by-user':'Popup closed.',
    'auth/network-request-failed':'Network error. Check connection.'};
  return map[code]||'Something went wrong. Try again.';
}

// ─────────────────────────────────────── AUTH STATE ───────────────────────────
onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUser = user;
    const snap = await getDoc(doc(db,'users',user.uid));
    if(snap.exists()){
      userProfile = snap.data();
    } else {
      userProfile = { uid:user.uid, displayName:user.displayName, email:user.email, role:'student', points:0, enrolledClasses:[] };
    }
    document.getElementById('auth-screen').style.display='none';
    launchApp();
  } else {
    currentUser=null; userProfile=null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('auth-screen').style.display='flex';
  }
});

// ─────────────────────────────────────── APP LAUNCH ───────────────────────────
function launchApp(){
  const app = document.getElementById('app');
  app.classList.add('show');
  document.getElementById('topbar-user-name').textContent = userProfile.displayName || userProfile.email;
  document.getElementById('topbar-role-badge').textContent = (userProfile.role||'student').toUpperCase();

  if(userProfile.role === 'teacher'){
    buildTeacherApp();
  } else {
    buildStudentApp();
  }
}

async function loadStudentClasses(){
  const grid = document.getElementById('student-classes-grid');
  if(!grid) return;
  grid.innerHTML = '<div style="color:var(--text3);font-size:13px;">Loading...</div>';

  // Check for pending invites
  const inviteSnaps = await getDocs(query(collection(db,'invites'),where('studentEmail','==',currentUser.email)));
  const pendingInvites = inviteSnaps.docs.filter(d=>d.data().status==='pending');
  // Separate team invites for badge
  const pendingTeamInvites = pendingInvites.filter(d=>d.data().type==='team');
  const inviteBadge = document.getElementById('invite-badge');
  if(inviteBadge) inviteBadge.style.display = pendingInvites.length>0 ? 'block':'none';

  const enrolled = userProfile.enrolledClasses || [];
  if(!enrolled.length){
    grid.innerHTML = `<div class="empty-state">${ico('grid',48)}<h3>No classes yet</h3><p>Your teacher will invite you by email. Check your pending invites above.</p></div>`;
    return;
  }

  const classes = [];
  for(const cid of enrolled){
    const s = await getDoc(doc(db,'classes',cid));
    if(s.exists()) classes.push({id:s.id,...s.data()});
  }

  if(!classes.length){ grid.innerHTML=`<div class="empty-state">${ico('grid',48)}<h3>No classes found</h3></div>`; return; }

  grid.innerHTML = classes.map(c=>`
    <div class="class-card fade-in" onclick="openStudentClass('${c.id}')">

        <span class="badge badge-white">${c.students?.length||0} students</span>
        <span id="cpct-${c.id}" style="font-family:var(--mono);font-size:11px;color:var(--text3);">0%</span>
      </div>
    </div>`).join('');

  // load progress per class
  for(const c of classes) loadClassProgress(c.id);
}

window.acceptInvite = async(inviteId, classId)=>{
  const invSnap = await getDoc(doc(db,'invites',inviteId));
  if(!invSnap.exists()) return;
  const invData = invSnap.data();
  await updateDoc(doc(db,'invites',inviteId),{status:'accepted',acceptedAt:serverTimestamp()});

  if(invData.type === 'team'){
    // Join team
    await updateDoc(doc(db,'teams',classId),{members:arrayUnion(currentUser.uid)});
    await updateDoc(doc(db,'users',currentUser.uid),{teamIds:arrayUnion(classId)});
    userProfile.teamIds = [...(userProfile.teamIds||[]),classId];
    closeModalDirect();
    toast('Joined team!','success');
    loadStudentClasses();
  } else {
    // Join class
    await updateDoc(doc(db,'users',currentUser.uid),{enrolledClasses:arrayUnion(classId)});
    await updateDoc(doc(db,'classes',classId),{students:arrayUnion(currentUser.uid)});
    userProfile.enrolledClasses = [...(userProfile.enrolledClasses||[]),classId];
    closeModalDirect();
    toast('Joined class!','success');

  }

async function loadClassProgress(classId){
  const lessons = await getDocs(query(collection(db,'lessons'),where('classId','==',classId)));
  const total = lessons.size;
  if(!total) return;
  const prog = await getDoc(doc(db,'progress',`${currentUser.uid}_${classId}`));
  const completed = prog.exists() ? (prog.data().completedLessons||[]).length : 0;
  const pct = Math.round((completed/total)*100);
  const fill = document.getElementById(`cp-${classId}`);
  const pctEl = document.getElementById(`cpct-${classId}`);
  if(fill){ fill.style.width=pct+'%'; fill.className='progress-fill'+(pct===100?' success':pct>60?' ':''); }
  if(pctEl) pctEl.textContent = pct+'%';
}

async function loadClassLessons(classId){
  const el = document.getElementById('class-tab-content');
  el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0;">Loading lessons...</div>';
  const q = query(collection(db,'lessons'),where('classId','==',classId));
  const snaps = await getDocs(q);
  const progSnap = await getDoc(doc(db,'progress',`${currentUser.uid}_${classId}`));
  const completed = progSnap.exists()?(progSnap.data().completedLessons||[]):[];

  if(!snaps.size){ el.innerHTML='<div class="empty-state"><h3>No lessons yet</h3><p>Your teacher hasn\'t added any lessons.</p></div>'; return; }

  const sortedDocs = [...snaps.docs].sort((a,b)=>(a.data().order||0)-(b.data().order||0));
  el.innerHTML = sortedDocs.map(d=>{
    const l={id:d.id,...d.data()};
    const done = completed.includes(l.id);
    return `<div class="lesson-item" onclick="openLesson('${l.id}','${classId}')">
      <div class="lesson-num">${String(l.order||1).padStart(2,'0')}</div>
      <div class="lesson-info">
        <div class="lesson-title">${l.title}</div>
        <div class="lesson-meta">${l.type||'Lesson'} · ${l.duration||''}</div>
      </div>
      <div class="lesson-status">
        ${done ? '<span class="badge badge-success">✓ Done</span>' : '<span class="badge badge-grey">Not started</span>'}
      </div>
    </div>`;
  }).join('');
}

async function loadStudentLessons(){
  const container = document.getElementById('student-lessons-list');
  if(!container) return;
  const enrolled = userProfile.enrolledClasses||[];
  if(!enrolled.length){ container.innerHTML='<div class="empty-state"><h3>Join a class to see lessons</h3></div>'; return; }

  container.innerHTML='<div style="color:var(--text3);font-size:13px;">Loading...</div>';

  // build class filter
  const classData={};
  for(const cid of enrolled){
    const s=await getDoc(doc(db,'classes',cid));
    if(s.exists()) classData[cid]={id:cid,...s.data()};
  }

  const filterEl = document.getElementById('student-class-filter');
  filterEl.innerHTML = `<button class="btn btn-white btn-sm" onclick="filterStudentLessons('all')">All</button>`+
    Object.values(classData).map(c=>`<button class="btn btn-ghost btn-sm" onclick="filterStudentLessons('${c.id}')">${c.name}</button>`).join('');

  window._allLessonsData = []; window._classData = classData;

  for(const cid of enrolled){
    const q=query(collection(db,'lessons'),where('classId','==',cid));
    const snaps=await getDocs(q);
    const progSnap=await getDoc(doc(db,'progress',`${currentUser.uid}_${cid}`));
    const completed=progSnap.exists()?(progSnap.data().completedLessons||[]):[];
    snaps.docs.forEach(d=>window._allLessonsData.push({id:d.id,...d.data(),completed:completed.includes(d.id),className:classData[cid]?.name||cid}));
  }

  renderStudentLessons(window._allLessonsData);
}

window.filterStudentLessons = (classId)=>{
  const data = classId==='all' ? window._allLessonsData : window._allLessonsData.filter(l=>l.classId===classId);
  renderStudentLessons(data);
};

function renderStudentLessons(lessons){

      <div class="lesson-num">${String(l.order||1).padStart(2,'0')}</div>

        <div class="lesson-title">${l.title}</div>
        <div class="lesson-meta">${l.className} · ${l.type||'Lesson'} · ${l.duration||''}</div>

window.openMessageTeacher = (classId, teacherId, teacherName)=>{
  const threadId = [currentUser.uid, teacherId].sort().join('_')+'_'+classId;
  openModal(`Message ${teacherName}`,`
    <div class="chat-wrap" style="height:360px;">
      <div class="chat-messages" id="chat-msgs-${threadId}">
        <div style="text-align:center;font-size:12px;color:var(--text3);padding:20px;">Loading messages...</div>
      </div>
      <div class="chat-input-wrap">
        <input class="chat-input" id="chat-input-${threadId}" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg('${threadId}','${teacherId}','${teacherName}')">
        <button class="btn btn-white btn-sm" onclick="sendMsg('${threadId}','${teacherId}','${teacherName}')">Send</button>
      </div>
    </div>`);
  loadMessages(threadId);
};

async function loadMessages(threadId){
  const el = document.getElementById(`chat-msgs-${threadId}`);
  if(!el) return;
  const q = query(collection(db,'messages',threadId,'msgs'),orderBy('createdAt'));
  const unsub = onSnapshot(q, snaps=>{
    if(!document.getElementById(`chat-msgs-${threadId}`)) return;
    el.innerHTML = snaps.empty ? '<div style="text-align:center;font-size:12px;color:var(--text3);padding:20px;">No messages yet. Say hello!</div>' :
      snaps.docs.map(d=>{
        const m=d.data();
        const mine=m.senderId===currentUser.uid;
        return `<div class="chat-msg ${mine?'sent':'recv'}">
          <div>${m.text}</div>
          <div class="chat-msg-meta">${mine?'You':m.senderName} · ${timeAgo(m.createdAt)}</div>
        </div>`;
      }).join('');
    el.scrollTop=el.scrollHeight;
  });
  messageListeners[threadId]=unsub;
}

window.sendMsg = async(threadId, recipientId, recipientName)=>{
  const input = document.getElementById(`chat-input-${threadId}`);
  if(!input||!input.value.trim()) return;
  const text = input.value.trim(); input.value='';
  await setDoc(doc(db,'messages',threadId),{
    participants:[currentUser.uid,recipientId],
    lastMessage:text, lastMessageTime:serverTimestamp(),
    participantNames:{[currentUser.uid]:userProfile.displayName,[recipientId]:recipientName}
  },{merge:true});
  await addDoc(collection(db,'messages',threadId,'msgs'),{
    senderId:currentUser.uid, senderName:userProfile.displayName,
    recipientId, text, createdAt:serverTimestamp()
  });
};

window.switchDashTab = (tab)=>{

};

async function loadAIClassDropdown(){
  const sel = document.getElementById('ai-class');

  const q = query(collection(db,'classes'),where('teacherId','==',currentUser.uid));

}

async function geminiCall(apiKey, prompt, model='gemini-3-flash-preview'){
  const key = apiKey || GEMINI_API_KEY;
  if(!key) throw new Error('No Gemini API key. Enter it in the AI Lesson Creator panel.');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:0.7,topP:0.95,maxOutputTokens:8192}
    })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.error?.message||`Gemini API error ${res.status}`);
  }
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text||'';
}

// Ask Gemini to find a real web image URL for the given topic
async function geminiGenerateImage(apiKey, prompt){
  const key = apiKey || GEMINI_API_KEY;
  if(!key) return null;
  try{
    const searchPrompt = `Find a real, publicly accessible image URL from the web that best illustrates: "${prompt}"

Requirements:
- Must be a direct image URL ending in .jpg, .jpeg, .png, .gif, or .webp
- Must be from a reputable educational or reference site (Wikipedia, NASA, educational institutions, robotics sites, etc.)
- Must be relevant to VEX Robotics or the topic described
- Return ONLY the raw URL, nothing else: no markdown, no explanation, no quotes

If you cannot find a suitable image URL, return the word: NONE`;

    const text = await geminiCall(key, searchPrompt, 'gemini-3-flash-preview');
    const trimmed = (text||'').trim();
    if(!trimmed || trimmed === 'NONE' || trimmed.length < 10) return null;
    // Validate it looks like a URL
    const urlMatch = trimmed.match(/https?:\/\/[^\s"'<>]+\.(jpg|jpeg|png|gif|webp)(\?[^\s"'<>]*)?/i);
    return urlMatch ? urlMatch[0] : null;
  }catch(e){ return null; }
}

window.aiGenerateOutline = async()=>{

  const topic = document.getElementById('ai-topic')?.value.trim();
  const context = document.getElementById('ai-context')?.value.trim();
  const depth = document.getElementById('ai-depth')?.value;
  const duration = document.getElementById('ai-duration')?.value;
  const instructions = document.getElementById('ai-instructions')?.value.trim();

  if(!topic){ toast('Enter a lesson topic','error'); return; }
  if(!apiKey||apiKey.includes('REPLACE')){ toast('Set your Gemini API key in the code (GEMINI_API_KEY)','error'); return; }

  actions.style.display='none';

  const depthDesc={intro:'introductory level with simple concepts',standard:'standard depth with concepts and application examples',deep:'deep coverage with theory, code examples, and lab exercises'};
  const prompt = `You are an expert VEX Robotics educator. Create a detailed lesson outline for:

Topic: "${topic}"
Audience: ${context||'High school robotics students'}

window.aiGenerateFullLesson = async()=>{
  if(!aiOutlineData){ toast('Generate outline first','error'); return; }
  const apiKey = (document.getElementById('ai-key')?.value||'').trim();
  if(!apiKey){ toast('Enter your Gemini API key in step 1','error'); return; }

  const step3 = document.getElementById('ai-step3');
  const progEl = document.getElementById('ai-gen-progress');
  step3.style.display='block';
  document.getElementById('ai-step4').style.display='none';

  const sections = aiOutlineData.sections||[];
  const totalSteps = sections.length + 2; // +2 for intro & image generation
  let completed = 0;

  const setProgress = (msg, pct)=>{
    progEl.innerHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:8px;">${msg}</div>
      <div class="ai-progress-bar"><div class="ai-progress-fill" style="width:${pct}%"></div></div>
      <div class="ai-progress-text">${Math.round(pct)}% complete · ${sections.filter(s=>s._done).length}/${sections.length} sections</div>`;
  };

  aiGeneratedBlocks = [];
  const topic = document.getElementById('ai-topic')?.value.trim();
  const context = document.getElementById('ai-context')?.value.trim();
  const depth = document.getElementById('ai-depth')?.value;
  const instructions = document.getElementById('ai-instructions')?.value.trim();

  // Build each section
  for(let i=0; i<sections.length; i++){
    const s = sections[i];
    setProgress(`Writing section ${i+1}/${sections.length}: "${s.title}"...`, (i/totalSteps)*90);

    // Ask for raw HTML directly - much more reliable than JSON-wrapped HTML
    const depthGuide = {
      intro: 'Write 2-3 short paragraphs. Keep it simple and clear. Focus on the core concept only.',
      standard: 'Write 3-5 paragraphs with concrete examples. Include a real-world VEX application.',
      deep: 'Write 5-8 paragraphs. Include theory, step-by-step explanation, code examples where relevant, and common mistakes to avoid.'
    }[depth] || 'Write 3-5 paragraphs with clear explanations.';

    const quizGuide = s.type === 'quiz' ? `
Since this is a quiz section, include 2-3 multiple choice questions using exactly this HTML structure (copy it exactly):
<div class="quiz-block">
  <div class="quiz-question">Your question here?</div>
  <div class="quiz-opt" data-idx="0">Option A text</div>
  <div class="quiz-opt" data-idx="1">Option B text</div>
  <div class="quiz-opt correct-answer" data-idx="2">Correct option text</div>
  <div class="quiz-opt" data-idx="3">Option D text</div>
  <div class="quiz-explain">Explanation of why the correct answer is right.</div>
</div>` : '';

    const sectionPrompt = `You are writing one section of a VEX Robotics educational lesson.

Lesson title: "${aiOutlineData.title}"
Section title: "${s.title}"
Section type: ${s.type}
Audience: ${context || 'High school robotics students'}
${instructions ? 'Extra instructions: ' + instructions : ''}

${depthGuide}
${quizGuide}

CRITICAL RULES:
1. Output ONLY raw HTML. No markdown, no code fences, no JSON, no explanation text before or after.
2. Do NOT include the section heading as an h2 tag. It is already added above your content.
3. Use <h3> for subsection headings inside this section
4. Use <p> tags for all paragraph text. Every sentence must be inside a <p> tag.
5. Use <ul><li> for bullet lists
6. Use <strong> for key terms
7. For code examples use: <pre><code class="lang-javascript">your code here</code></pre>
8. Write substantial content: at least 150 words of actual educational text
9. Start your output directly with the first HTML tag, nothing else

Write the full HTML content for this section now:`;

    try {
      let raw = await geminiCall(apiKey, sectionPrompt);

      // Strip any accidental markdown fences or preamble text
      raw = raw
        .replace(/^```html\s*/i, '')
        .replace(/^```\s*/i, '')
        .replace(/\s*```$/i, '')
        .trim();

      // If Gemini still returned JSON somehow, extract content field
      if(raw.startsWith('{') || raw.startsWith('{"')){
        try {
          const parsed = JSON.parse(raw);
          raw = parsed.content || parsed.html || raw;
        } catch(e){ /* not JSON, use as-is */ }
      }

      // Ensure content has paragraph tags: if Gemini returned only plain text wrap it
      const hasParas = raw.includes("<p") || raw.includes("<ul") || raw.includes("<ol");
      if(!hasParas && raw.length > 20){
        raw = raw.split(String.fromCharCode(10))
          .map(function(line){ return line.trim(); })
          .filter(function(line){ return line.length > 0; })
          .map(function(line){ return /^<[a-zA-Z]/.test(line) ? line : "<p>" + line + "</p>"; })
          .join(String.fromCharCode(10));
      }

      // Add h2 heading
      aiGeneratedBlocks.push({...blockDefaults('heading'), text:s.title, level:'h2'});

      // Add image placeholder if needed
      if(s.hasImage){
        const imgBlock = {...blockDefaults('image'), src:'', alt:s.title, caption:s.imagePrompt?.slice(0,80)||s.title, _imagePrompt:s.imagePrompt};
        aiGeneratedBlocks.push(imgBlock);
        s._imgBlockId = imgBlock.id;
      }

      // Store raw HTML in the block
      aiGeneratedBlocks.push({...blockDefaults('text'), text:'', _html:raw, type:'text'});
      s._done = true;

    } catch(e){
      console.error('Section generation error:', e);
      aiGeneratedBlocks.push({...blockDefaults('heading'), text:s.title, level:'h2'});
      aiGeneratedBlocks.push({...blockDefaults('callout'),
        text:`Could not generate this section: ${e.message}. Try regenerating.`,
        variant:'warn'});
    }
    completed++;
  }

  // Image blocks are left as empty placeholders. Teachers can add images
  // in the preview editor (Step 4) by clicking the image block
  const imageSections = sections.filter(s=>s.hasImage&&s._imgBlockId);
  if(imageSections.length){
    // Just label them so the preview editor knows what image to look for
    imageSections.forEach(s=>{
      const block = aiGeneratedBlocks.find(b=>b.id===s._imgBlockId);
      if(block){ block.alt = s.title; block.caption = s.imagePrompt?.slice(0,80)||s.title; }
    });
  }

  setProgress('Finalizing lesson...', 98);

  // Build HTML content string from blocks
  aiGeneratedContent = aiGeneratedBlocks.map(b=>{
    if(b._html) return b._html;
    return renderBlockToHTML(b);
  }).join('\n');

  completed = totalSteps;
  setProgress('Lesson ready!', 100);

  // Show preview
  setTimeout(()=>{
    document.getElementById('ai-step4').style.display='block';
    renderAIPreview();
  },400);
};

function renderBlockToHTML(b){
  switch(b.type){
    case 'heading': return `<${b.level||'h2'}>${b.text}</${b.level||'h2'}>`;
    case 'text': {
      // _html takes priority - this is where AI-generated content lives
      if(b._html && b._html.trim()) return b._html;
      if(b.text && b.text.trim()) return `<p>${b.text}</p>`;
      return '';
    }
    case 'image': return b.src?`<figure><img src="${b.src}" alt="${b.alt||''}" style="max-width:100%;border-radius:8px;"><figcaption>${b.caption||''}</figcaption></figure>`:'';
    case 'callout': return `<div class="callout callout-${b.variant||'info'}" style="border-left:3px solid var(--${b.variant==='warn'?'warn':b.variant==='danger'?'danger':b.variant==='success'?'success':'white'});padding:14px 18px;background:var(--surface2);margin:12px 0;">${b.text}</div>`;
    case 'list': return `<ul>${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'code': return `<pre><code class="lang-${b.lang||'text'}">${b.text||''}</code></pre>`;
    case 'divider': return `<hr>`;
    case 'video': {
      const yt=b.url?.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
      if(yt) return `<div style="position:relative;padding-bottom:56.25%;"><iframe src="https://www.youtube.com/embed/${yt[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allowfullscreen></iframe></div>`;
      return '';
    }
    default: return '';
  }
}

function renderAIPreview(){
  const previewEl = document.getElementById('ai-preview-body');
  if(!previewEl) return;

  // Group blocks into sections: each h2 heading starts a new section
  const sectionGroups = [];
  let current = null;
  aiGeneratedBlocks.forEach((block, idx) => {
    if(block.type === 'heading' && block.level === 'h2'){
      current = { headingIdx: idx, heading: block, contentBlocks: [] };
      sectionGroups.push(current);
    } else if(current){
      current.contentBlocks.push({ block, idx });
    }
  });

  // Render lesson title
  const lessonTitle = aiOutlineData?.title || document.getElementById('ai-topic')?.value || 'Lesson';
  const lessonType = document.getElementById('ai-type')?.value || 'Lesson';
  const lessonDuration = document.getElementById('ai-duration')?.value || '';

  let html = `
    <div style="margin-bottom:28px;">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
        <span class="badge badge-white">${lessonType}</span>
        ${lessonDuration ? `<span style="font-family:var(--mono);font-size:11px;color:var(--text3);">⏱ ${lessonDuration}</span>` : ''}
        <span style="font-family:var(--mono);font-size:10px;color:var(--success);">✓ ${sectionGroups.length} sections generated</span>
      </div>
      <div style="font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--white);margin-bottom:8px;">${lessonTitle}</div>
      <div style="height:1px;background:var(--border);margin-top:16px;"></div>
    </div>`;

  sectionGroups.forEach((sg, sIdx) => {
    const sectionId = 'ai-sec-' + sIdx;
    html += `
      <div class="ai-preview-section" id="${sectionId}" data-sidx="${sIdx}"
           style="margin-bottom:4px;border-radius:6px;border:2px solid transparent;transition:border-color .15s;cursor:pointer;"
           onclick="aiSelectSection(${sIdx})"
           onmouseenter="this.style.borderColor='var(--border)'"
           onmouseleave="if(window._aiSelectedSection!==${sIdx}) this.style.borderColor='transparent'">
        <div style="padding:16px 16px 4px;">
          <div style="font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--white);margin-bottom:12px;border-top:1px solid var(--border);padding-top:20px;">
            ${sg.heading.text}
            <span style="font-size:11px;font-weight:400;color:var(--text3);font-family:var(--mono);margin-left:10px;">click to edit</span>
          </div>
        </div>
        <div style="padding:0 16px 16px;" class="doc-content">`;

    sg.contentBlocks.forEach(({block}) => {
      if(block.type === 'image'){
        if(block.src){
          html += `<figure style="margin:12px 0;"><img src="${block.src}" alt="${block.alt||''}" style="max-width:100%;border-radius:8px;"><figcaption style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px;text-align:center;">${block.caption||''}</figcaption></figure>`;
        } else {
          html += `<div style="background:var(--surface2);border:1px dashed var(--border);border-radius:6px;padding:16px;text-align:center;font-size:12px;color:var(--text3);margin:12px 0;">🖼 No image added yet</div>`;
        }
      } else if(block.type === 'text'){
        const blockHtml = block._html || (block.text ? `<p>${block.text}</p>` : '');
        html += blockHtml;
      } else if(block.type === 'callout'){
        const borderCol = block.variant==='warn'?'var(--warn)':block.variant==='danger'?'var(--danger)':block.variant==='success'?'var(--success)':'var(--white)';
        html += `<div style="border-left:3px solid ${borderCol};padding:12px 16px;background:var(--surface2);border-radius:0 6px 6px 0;margin:12px 0;font-size:14px;color:var(--text2);">${block.text}</div>`;
      }
    });

    html += `</div></div>`;
  });

  previewEl.innerHTML = html;

  // Wire quiz interactions in preview
  previewEl.querySelectorAll('.quiz-opt').forEach(opt => {
    opt.style.cursor = 'pointer';
    opt.addEventListener('click', function(){
      const block = this.closest('.quiz-block');
      if(!block || block.dataset.answered) return;
      block.dataset.answered = '1';
      const correct = this.dataset.correct === 'true' || this.classList.contains('correct-answer');
      block.querySelectorAll('.quiz-opt').forEach(o => {
        o.style.pointerEvents = 'none';
        if(o.classList.contains('correct-answer') || o.dataset.correct === 'true'){
          o.style.borderColor = 'var(--success)'; o.style.color = 'var(--success)';
        } else if(o === this && !correct){
          o.style.borderColor = 'var(--danger)'; o.style.color = 'var(--danger)';
        }
      });
      const explain = block.querySelector('.quiz-explain');
      if(explain) explain.style.display = 'block';
    });
  });
}

Output ONLY raw HTML: no markdown, no code fences, no explanation.

  try {

    const hasParas = raw.includes('<p') || raw.includes('<ul') || raw.includes('<ol');
    if(!hasParas && raw.length > 20){
      raw = raw.split(String.fromCharCode(10))
        .map(function(line){ return line.trim(); })
        .filter(function(line){ return line.length > 0; })
        .map(function(line){ return /^<[a-zA-Z]/.test(line) ? line : '<p>' + line + '</p>'; })

  const metaEl = document.getElementById('db-meta-line');

  // Fetch lessons
  let lessonsQuery;
  if(selectedClassId){
    lessonsQuery = await getDocs(query(collection(db,'lessons'),where('classId','==',selectedClassId)));
  } else {
    lessonsQuery = await getDocs(query(collection(db,'lessons'),where('teacherId','==',currentUser.uid)));
  }
  const totalLessons = lessonsQuery.size;

  // Gather all students across selected classes
  const allStudentIds = [...new Set(classArr.flatMap(c=>c.students||[]))];

  // Per-student progress data
  const studentData = [];
  for(const uid of allStudentIds){
    const uSnap = await getDoc(doc(db,'users',uid));
    if(!uSnap.exists()) continue;
    const u = uSnap.data();
    let completedCount = 0;
    for(const cls of classArr){
      const p = await getDoc(doc(db,'progress',`${uid}_${cls.id}`));
      if(p.exists()) completedCount += (p.data().completedLessons||[]).length;
    }
    const pct = totalLessons>0 ? Math.round((completedCount/totalLessons)*100) : 0;
    studentData.push({ uid, name:u.displayName||u.email||'Student', email:u.email||'',
      points:u.points||0, completed:completedCount, total:totalLessons, pct,
      foundations:u.foundations||0, cad:u.cad||0, programming:u.programming||0 });

  const allDone = studentData.filter(s=>s.pct===100).length;

          <div class="db-score-pct ${scoreClass}">${avgScore}%</div>
          <div class="db-score-sub">Class average across ${totalLessons} lesson${totalLessons!==1?'s':''}</div>
        </div>
        <div class="db-score-divider"></div>
        <div class="db-score-assigned">
          <div class="db-score-label">Work Assigned</div>
          <div class="db-score-assigned-num">${totalLessons}</div>
          <div class="db-score-assigned-label">Total lessons scheduled</div>
        </div>
        <div class="db-score-trophy">🏆</div>

          <div class="db-status-tile-label">students have completed all work</div>
        </div>
        <div class="db-status-tile db-tile-yellow">
          <div class="db-status-tile-num">${inProgress}</div>
          <div class="db-status-tile-label">students are making progress</div>
        </div>

          <div class="db-status-tile-num">${needsAttention}</div>
          <div class="db-status-tile-label">student needs attention (below 50%)</div>

        <div class="db-progress-title">Student Progress</div>

      </div>
      ${studentData.length===0 ? `

          No students enrolled yet. <button class="btn btn-ghost btn-sm" style="margin-left:8px;" onclick="openAddStudentFromStudentsPanel()">Add Students</button>
        </div>` : `

        <tbody>
          ${studentData.map(s=>{

            const progColor = s.pct===100?'var(--success)':s.pct>=50?'var(--warn)':'var(--danger)';
            const pctClass = s.pct===0?'zero':s.pct===100?'full':'';

async function loadRecentActivity(){
  const el = document.getElementById('recent-activity');
  if(!el) return;
  // get recent completions across teacher's students
  const classes = await getDocs(query(collection(db,'classes'),where('teacherId','==',currentUser.uid)));
  const activities=[];
  for(const cls of classes.docs){
    const cData=cls.data();
    for(const uid of (cData.students||[])){
      const p=await getDoc(doc(db,'progress',`${uid}_${cls.id}`));
      if(p.exists()&&p.data().updatedAt){
        const uSnap=await getDoc(doc(db,'users',uid));
        if(uSnap.exists()) activities.push({
          name:uSnap.data().displayName, class:cData.name,
          time:p.data().updatedAt, completed:(p.data().completedLessons||[]).length
        });
      }
    }
  }
  activities.sort((a,b)=>b.time?.seconds-a.time?.seconds);
  if(!activities.length){ el.innerHTML='<span>No activity yet.</span>'; return; }
  el.innerHTML=activities.slice(0,6).map(a=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:600;color:var(--white);">${a.name}</div>
        <div style="font-size:12px;color:var(--text3);">${a.class} · ${a.completed} lessons done</div>
      </div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);">${timeAgo(a.time)}</div>
    </div>`).join('');
}

window.postAnnouncement = async()=>{
  const classId=document.getElementById('ann-class').value;
  const title=document.getElementById('ann-title').value.trim();
  const body=document.getElementById('ann-body').value.trim();
  if(!title||!body){ toast('Fill in title and message','error'); return; }
  if(classId){
    await addDoc(collection(db,'announcements'),{classId,title,body,authorId:currentUser.uid,authorName:userProfile.displayName,createdAt:serverTimestamp()});
  } else {
    const classes=await getDocs(query(collection(db,'classes'),where('teacherId','==',currentUser.uid)));
    for(const c of classes.docs) await addDoc(collection(db,'announcements'),{classId:c.id,title,body,authorId:currentUser.uid,authorName:userProfile.displayName,createdAt:serverTimestamp()});
  }
  document.getElementById('ann-title').value='';
  document.getElementById('ann-body').value='';
  toast('Announcement posted!','success');
};

async function loadTeamsDashboard(){
  const el = document.getElementById('analytics-body');
  if(!el) return;
  el.innerHTML = '<div style="color:var(--text3);font-size:13px;">Loading teams...</div>';

  // Fetch all teams where user is coach or member
  const coachSnap  = await getDocs(query(collection(db,'teams'),where('teacherId','==',currentUser.uid)));
  const memberSnap = await getDocs(query(collection(db,'teams'),where('members','array-contains',currentUser.uid)));
  const allTeamMap = {};
  [...coachSnap.docs,...memberSnap.docs].forEach(d=>{ allTeamMap[d.id]={id:d.id,...d.data()}; });
  const teams = Object.values(allTeamMap);

  // Update meta
  const metaEl = document.getElementById('db-meta-line');
  if(metaEl) metaEl.textContent = `${userProfile.displayName||'Teacher'} · ${teams.length} team${teams.length!==1?'s':''}`;

  if(!teams.length){
    el.innerHTML = `
      <div class="empty-state" style="padding-top:60px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        <h3 style="margin-top:12px;">No teams yet</h3>
        <p>Create a team in Competition Mode to see team stats here.</p>
        <button class="btn btn-white" style="margin-top:14px;" onclick="tNav('competition')">Go to Competition Mode</button>
      </div>`;
    return;
  }

  // Team filter chips
  const selTeamId = window._dbSelectedTeamId || teams[0]?.id || '';
  window._dbSelectedTeamId = selTeamId;
  const team = teams.find(t=>t.id===selTeamId) || teams[0];

  // Fetch team subcollections in parallel
  const [evSnaps, taskSnaps] = await Promise.all([
    getDocs(collection(db,'teams',team.id,'events')),
    getDocs(collection(db,'teams',team.id,'tasks'))
  ]);

  const now = new Date();
  const events = evSnaps.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>{
      const da = a.date?.toDate?a.date.toDate():new Date(a.date||0);
      const db2 = b.date?.toDate?b.date.toDate():new Date(b.date||0);
      return da-db2;
    });
  const upcomingEvents = events.filter(e=>{
    const d = e.date?.toDate?e.date.toDate():new Date(e.date||0);
    return d >= now;
  });
  const tasks = taskSnaps.docs.map(d=>({id:d.id,...d.data()}));
  const openTasks = tasks.filter(t=>!t.done);
  const doneTasks = tasks.filter(t=>t.done);
  const taskPct = tasks.length ? Math.round((doneTasks.length/tasks.length)*100) : 0;

  // W/L/T
  const wins = team.wins||0, losses = team.losses||0, ties = team.ties||0;
  const totalMatches = wins+losses+ties;

      ${teams.map(t=>`

        </button>`).join('')}
      <button class="btn btn-ghost btn-sm" onclick="tNav('competition')" style="margin-left:auto;">
        Open Competition Mode →
      </button>
    </div>

    <!-- Top stats row -->

      <div class="db-score-card">
        <div class="db-score-main">
          <div class="db-score-label">World Skills Rank</div>
          <div class="db-score-pct ${team.worldSkillsRank&&team.worldSkillsRank&&team.worldSkillsRank!=='N/A'?'warn':'zero'}"
               style="font-size:${team.worldSkillsRank&&team.worldSkillsRank.length>4?'28px':'42px'};">
            ${team.worldSkillsRank||'N/A'}
          </div>
          <div class="db-score-sub">Skills score: ${team.skillsScore||'N/A'}</div>
        </div>
        <div class="db-score-divider"></div>
        <div class="db-score-main">
          <div class="db-score-label">Match Record</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;">${wins}W · ${losses}L · ${ties}T</div>
          <div class="db-score-sub">Win rate: ${winRate}%</div>
        </div>
        <div class="db-score-divider"></div>
        <div class="db-score-main">

        </div>
      </div>
    </div>

    <!-- Two column: events + tasks -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">

      <!-- Upcoming Events -->
      <div class="db-progress-section">
